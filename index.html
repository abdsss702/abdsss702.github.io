:root[data-theme="dark"]{--bg:#0d1317;--card:#151d23;--line:#1f3a3d;--muted:#8fa3a8;--text:#F7F9FA}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 420px at 50% 0%,rgba(40,170,165,.22),transparent 70%),radial-gradient(500px 400px at 100% 100%,rgba(8,126,131,.16),transparent 70%)}
main{position:relative;max-width:520px;margin:0 auto;padding:18px 16px 50px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:var(--card);color:var(--teal);border:1px solid var(--line);border-radius:30px;padding:9px 16px;font:700 14px 'Cairo';cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.5px;color:var(--teal);font-size:15px}

.avatar .in{width:100%;height:100%;border-radius:50%;background:var(--ink);border:4px solid var(--bg);display:grid;place-items:center;overflow:hidden}

.avatar .in svg{width:70px;height:70px}
.badge{position:absolute;bottom:4px;inset-inline-end:4px;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;border:3px solid var(--bg)}

.bio{text-align:center;color:var(--muted);font-size:15.5px;line-height:1.9;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 6px;text-align:center}
.stat b{display:block;font-size:25px;font-weight:800;color:var(--teal);margin-bottom:2px}
.stat span{color:var(--muted);font-size:12.5px;line-height:1.4;display:block}
h2{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:18px;font-weight:700;margin:30px 0 12px}
h2 i{width:8px;height:22px;border-radius:4px;background:linear-gradient(var(--teal),var(--teal2))}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}
.wa{background:linear-gradient(160deg,rgba(8,126,131,.35),var(--card));border-color:var(--teal2)}
.row{display:flex;align-items:center;gap:14px}
.ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;background:rgba(40,170,165,.14)}
.ico svg{width:28px;height:28px}
.ttl{font-size:19px;font-weight:800}.sub{color:var(--muted);font-size:15px;direction:ltr;text-align:start;margin-top:2px}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{border:0;border-radius:16px;padding:14px;font:800 16px 'Cairo';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;flex:1}

.b1{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff}
.b2{background:rgba(40,170,165,.14);color:var(--teal);border:1px solid var(--line)}
.bw{background:var(--wa);color:#06210f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;font-weight:700;font-size:14.5px;line-height:1.4}
.svc .ico{width:40px;height:40px;border-radius:12px}.svc .ico svg{width:21px;height:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(40,170,165,.12);border:1px solid var(--line);color:var(--teal);border-radius:30px;padding:7px 14px;font-weight:700;font-size:14px}
.trust{display:flex;flex-direction:column;gap:8px}
.trust div{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
.trust svg{width:20px;height:20px;color:var(--teal);flex:none}
.link{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:12px;text-decoration:none;color:inherit;transition:.2s}
.link:active,.link:hover{border-color:var(--teal);transform:translateY(-1px)}
.link .t{font-size:18px;font-weight:800}.link .h{color:var(--muted);font-size:14px;direction:ltr;text-align:start}.link .tx{flex:1;min-width:0}
.chev{width:20px;height:20px;color:var(--muted)}[dir=ltr] .chev{transform:scaleX(-1)}
label{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:600 15px 'Cairo';outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
textarea{min-height:90px;resize:vertical}
.info{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:15px;margin-bottom:10px}
.info svg{width:20px;height:20px;color:var(--teal);flex:none;margin-top:3px}
footer{text-align:center;color:var(--muted);font-size:13.5px;margin-top:30px}
#gear{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;display:none;place-items:center;box-shadow:0 6px 24px rgba(8,126,131,.5);cursor:pointer;z-index:20}
#gear svg{width:26px;height:26px}
